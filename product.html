  <aside class="drawer" data-bag hidden>
    <div class="drawer-head">
      <h2>Request</h2>
      <button type="button" class="text-btn" data-close-bag>Close</button>
    </div>
    <ul class="drawer-list" data-bag-list></ul>
    <p class="empty" data-bag-empty>Nothing added yet. Open a piece and add it here.</p>
    <div class="drawer-foot">
      <button type="button" class="text-btn" data-checkout>Send request</button>
    </div>
  </aside>
  <div class="scrim" data-scrim hidden></div>
  <dialog class="sheet" data-order-dialog>
    <form method="dialog" data-order-form>
      <h2>Request a quote</h2>
      <p>The studio replies by email with price and timing. Nothing is charged here.</p>
      <label>Name <input name="name" required /></label>
      <label>Email <input name="email" type="email" required /></label>
      <label>Phone <input name="phone" type="tel" /></label>
      <label>Ship to (optional) <textarea name="address" rows="2"></textarea></label>
      <label>Note <textarea name="note" rows="2"></textarea></label>
      <p class="sheet-status" data-order-error role="status" hidden></p>
      <div class="sheet-actions">
        <button type="button" class="text-btn" data-close-order>Close</button>
        <button type="submit">Send request</button>
      </div>
    </form>
  </dialog>
